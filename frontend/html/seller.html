<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JoelMart - Seller Dashboard</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>

        <h1>JoelMart</h1>

        <p>Seller Dashboard</p>

        <nav>
            <a href="products.html">View Store</a>
            <a href="seller.html">Seller Dashboard</a>
            <button type="button" onclick="logoutUser()">
                Logout
            </button>
        </nav>

    </header>

    <main>

        <section>

            <h2>Add Product</h2>

            <p id="addProductMessage"></p>

            <form id="addProductForm">

                <label for="productName">
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                    required
                >

                <br><br>

                <label for="productDescription">
                    Description
                </label>

                <textarea
                    id="productDescription"
                    rows="4"
                    placeholder="Enter product description"
                    required
                ></textarea>

                <br><br>

                <label for="productPrice">
                    Price
                </label>

                <input
                    type="number"
                    id="productPrice"
                    min="0"
                    step="0.01"
                    placeholder="Enter price"
                    required
                >

                <br><br>

                <label for="productStock">
                    Stock
                </label>

                <input
                    type="number"
                    id="productStock"
                    min="0"
                    placeholder="Enter stock quantity"
                    required
                >

                <br><br>

                <label for="productCategory">
                    Category
                </label>

                <input
                    type="text"
                    id="productCategory"
                    placeholder="Enter category"
                    required
                >

                <br><br>

                <label for="productImage">
                    Image URL
                </label>

                <input
                    type="url"
                    id="productImage"
                    placeholder="https://example.com/product.jpg"
                >

                <br><br>

                <button type="submit">
                    Add Product
                </button>

            </form>

        </section>

        <section>

            <h2>My Products</h2>

            <p id="sellerProductsMessage"></p>

            <div id="sellerProductsContainer"></div>

        </section>

        <section>

            <h2>Customer Orders</h2>

            <button
                type="button"
                onclick="loadSellerOrders()"
            >
                View Customer Orders
            </button>

            <div id="sellerOrdersContainer"></div>

        </section>

    </main>

    <script src="../js/api.js"></script>
    <script src="../js/seller.js"></script>

</body>

</html>
