<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JoelMart - Register</title>

    <link rel="stylesheet"
          href="../css/auth.css">

</head>

<body class="auth-page">

    <div class="auth-background">

        <div class="auth-glow glow-one"></div>
        <div class="auth-glow glow-two"></div>
        <div class="auth-glow glow-three"></div>

    </div>

    <main class="auth-container">

        <section class="brand-section">

            <div class="brand-logo">
                JM
            </div>

            <h1>
                JoelMart
            </h1>

            <p>
                Join Our Marketplace
            </p>

            <span>
                Shop • Sell • Discover
            </span>

        </section>

        <section class="auth-card">

            <div class="auth-card-header">

                <h2>
                    Create Account
                </h2>

                <p>
                    Register to start using JoelMart
                </p>

            </div>

            <form id="registerForm">

                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="auth-button"
                    id="registerButton">
                    Create Account
                </button>

                <p
                    id="registerMessage"
                    class="auth-message">
                </p>

            </form>

            <div
                id="otpSection"
                style="display: none;">

                <div class="auth-divider">
                    <span>
                        Verify Your Email
                    </span>
                </div>

                <p
                    style="
                        text-align:center;
                        margin-bottom:18px;
                        color:#475569;
                        font-size:14px;
                    ">
                    Enter the 6-digit OTP sent to your email address.
                </p>

                <form id="otpForm">

                    <div class="form-group">

                        <label for="otpInput">
                            Verification OTP
                        </label>

                        <input
                            type="text"
                            id="otpInput"
                            placeholder="Enter 6-digit OTP"
                            inputmode="numeric"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            autocomplete="one-time-code"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="auth-button"
                        id="verifyOtpButton">
                        Verify OTP
                    </button>

                    <p
                        id="otpMessage"
                        class="auth-message">
                    </p>

                </form>

            </div>

            <div class="auth-divider">

                <span>
                    Already have an account?
                </span>

            </div>

            <a
                href="index.html"
                class="register-link">
                Back to Login
            </a>

            <p class="auth-footer">
                © 2026 JoelMart. All rights reserved.
            </p>

        </section>

    </main>

    <script src="../js/api.js"></script>

    <script src="../js/auth.js"></script>

</body>

</html>
