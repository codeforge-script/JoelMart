<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JoelMart - Admin Dashboard</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <style>

        .admin-table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #f1f5f9;
            font-weight: 700;
        }

        tr:hover {
            background: #f8fafc;
        }

        .admin-product-image {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .edit-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 6px;
        }

        .edit-button:hover {
            background: #1d4ed8;
        }

        .delete-button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #b91c1c;
        }

        .product-filter-area {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding: 18px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
        }

        .product-filter-area input,
        .product-filter-area select {
            flex: 1;
            min-width: 200px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .product-filter-area input:focus,
        .product-filter-area select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .clear-filter-button {
            background: #64748b;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .clear-filter-button:hover {
            background: #475569;
        }

        .product-count {
            margin-top: 15px;
            font-weight: 600;
            color: #475569;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-button {
            background: #e2e8f0;
            color: #0f172a;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
        }

        .close-button:hover {
            background: #cbd5e1;
        }

        .edit-form-group {
            margin-bottom: 18px;
        }

        .edit-form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #334155;
        }

        .edit-form-group input,
        .edit-form-group textarea,
        .edit-form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .edit-form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .edit-form-group input:focus,
        .edit-form-group textarea:focus,
        .edit-form-group select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .edit-form-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .save-product-button {
            flex: 1;
            background: #16a34a;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-product-button:hover {
            background: #15803d;
        }

        .cancel-product-button {
            flex: 1;
            background: #64748b;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .cancel-product-button:hover {
            background: #475569;
        }

        .product-id-display {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px 12px;
            border-radius: 8px;
            color: #475569;
            font-weight: 600;
        }

        .edit-image-preview {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-top: 10px;
        }

        @media (max-width: 700px) {

            .modal-content {
                padding: 20px;
            }

            .edit-form-actions {
                flex-direction: column;
            }

            .product-filter-area {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1>JoelMart</h1>

        <p>Admin Dashboard</p>

        <h2 id="adminWelcome">
            Admin
        </h2>

        <button type="button"
                onclick="logoutAdmin()">
            Logout
        </button>

    </header>

    <main>

        <section>

            <h2>Dashboard Overview</h2>

            <div id="adminStats">

                <div>
                    <h3>Total Users</h3>
                    <p id="totalUsers">0</p>
                </div>

                <div>
                    <h3>Total Products</h3>
                    <p id="totalProducts">0</p>
                </div>

                <div>
                    <h3>Total Orders</h3>
                    <p id="totalOrders">0</p>
                </div>

            </div>

        </section>

        <section>

            <h2>Admin Panel</h2>

            <p>
                Manage users, products, and orders from one place.
            </p>

        </section>

        <section>

            <h2>User Management</h2>

            <button type="button"
                    onclick="loadUsers()">
                View Users
            </button>

            <div id="usersContainer"></div>

        </section>

        <section>

            <h2>Product Management</h2>

            <button type="button"
                    onclick="loadAllProducts()">
                View All Products
            </button>

            <div class="product-filter-area">

                <input
                    type="text"
                    id="adminProductSearch"
                    placeholder="Search product name..."
                >

                <select id="adminProductCategory">

                    <option value="">
                        All Categories
                    </option>

                </select>

                <button
                    type="button"
                    class="clear-filter-button"
                    onclick="clearProductFilters()">
                    Clear Filters
                </button>

            </div>

            <div id="adminProductCount"
                 class="product-count">
            </div>

            <div id="adminProductsContainer"></div>

        </section>

        <section>

            <h2>Order Management</h2>

            <button type="button"
                    onclick="loadAllOrders()">
                View All Orders
            </button>

            <div id="adminOrdersContainer"></div>

        </section>

    </main>

    <div id="editProductModal"
         class="modal hidden">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Edit Product</h2>

                <button type="button"
                        class="close-button"
                        onclick="closeEditProductModal()">
                    ×
                </button>

            </div>

            <form id="editProductForm">

                <input type="hidden"
                       id="editProductId">

                <div class="edit-form-group">

                    <label>
                        Product ID
                    </label>

                    <div id="editProductIdDisplay"
                         class="product-id-display">
                        -
                    </div>

                </div>

                <div class="edit-form-group">

                    <label for="editProductName">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="editProductName"
                        required
                    >

                </div>

                <div class="edit-form-group">

                    <label for="editProductDescription">
                        Description
                    </label>

                    <textarea
                        id="editProductDescription"
                        required
                    ></textarea>

                </div>

                <div class="edit-form-group">

                    <label for="editProductPrice">
                        Price
                    </label>

                    <input
                        type="number"
                        id="editProductPrice"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>

                <div class="edit-form-group">

                    <label for="editProductStock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="editProductStock"
                        min="0"
                        required
                    >

                </div>

                <div class="edit-form-group">

                    <label for="editProductCategory">
                        Category
                    </label>

                    <input
                        type="text"
                        id="editProductCategory"
                        required
                    >

                </div>

                <div class="edit-form-group">

                    <label for="editProductImageUrl">
                        Image URL
                    </label>

                    <input
                        type="url"
                        id="editProductImageUrl"
                    >

                    <img
                        id="editProductImagePreview"
                        class="edit-image-preview"
                        src=""
                        alt="Product Preview"
                        style="display:none;"
                    >

                </div>

                <div class="edit-form-actions">

                    <button
                        type="submit"
                        class="save-product-button">
                        Save Changes
                    </button>

                    <button
                        type="button"
                        class="cancel-product-button"
                        onclick="closeEditProductModal()">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="../js/api.js"></script>

    <script src="../js/admin.js"></script>

</body>

</html>
